name: VM6 direct sync gate
on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Controlled old-head SHA to gate
        required: true
        type: string
permissions:
  contents: read
  statuses: write
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Publish controlled pending then success status
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state=pending \
            -f context=vm6-direct-sync-gate \
            -f description='VM6 controlled old-head pending gate'
          sleep 90
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state=success \
            -f context=vm6-direct-sync-gate \
            -f description='VM6 controlled old-head success gate'
