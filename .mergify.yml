pull_request_rules:
  - name: VM6 docs label copy inheritance safety probe
    conditions:
      - base = main
      - label = copy-to-prod
    actions:
      copy:
        branches:
          - prod
merge_protections:
  - name: VM6 CrossRepo Strict
    if: []
    success_conditions:
      - label = vm6-crossrepo-required
merge_protections_settings:
  reporting_method: check-runs
  post_comment: true
