pull_request_rules: []
commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write
merge_queue:
  mode: serial
  max_parallel_checks: 1
queue_rules:
  - name: VM6 label batch probe
    batch_size: 2
    batch_max_wait_time: 1 min
    queue_conditions:
      - base = vm6-label-batch-base-20260915
    merge_conditions:
      - label = bug
    max_checks_retries: 0
    merge_method: merge-batch
