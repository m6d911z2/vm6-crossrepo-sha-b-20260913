pull_request_rules:
  - name: VM6 copy trusted feature-push e2e
    conditions:
      - title ~= VM6_COPY_TRUSTED_E2E_20260917
    actions:
      copy:
        branches:
          - vm6-copy-target-20260917
merge_protections:
  - name: VM6 CrossRepo Strict
    if: []
    success_conditions:
      - label = vm6-crossrepo-required
merge_protections_settings:
  reporting_method: check-runs
  post_comment: true
